AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Drone surveillance system Dashboard API and Lambda functions
Globals:
  Function:
    Timeout: 40
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Parameters:
  DashboardBackendLambdaFunctionsRoleArn:
    Type: String
  DBHost:
    Type: String
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: True
  UserPoolArn:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  LambdaSecurityGroupId:
    Type: String
Resources:
  DashboardBackendApi:
    Type: AWS::Serverless::Api
    Properties:
      Description: Drone surveillance system Dashboard backend API
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          ResourcePath: "/*"
          HttpMethod: "*"
  DashboardBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          DB_HOST:
            Ref: DBHost
          DB_NAME: wf_detection
          DB_USER:
            Ref: DBUser
          DB_PASSWORD:
            Ref: DBPassword
          DB_PORT: "5432"
      CodeUri: src/
      Handler: app.handler
      Role:
        Ref: DashboardBackendLambdaFunctionsRoleArn
      Runtime: python3.13
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      LoggingConfig:
        LogFormat: JSON
        LogGroup: "/drone-surveillance-system/dashboard/logs"
      Events:
        ListIncidents:
          Type: Api
          Properties:
            RestApiId:
              Ref: DashboardBackendApi
            Path: /incidents
            Method: get
        CloseIncident:
          Type: Api
          Properties:
            RestApiId:
              Ref: DashboardBackendApi
            Path: /incidents/{gs_event_id}/close
            Method: post
    Metadata:
      BuildMethod: python3.13
Outputs:
  DashboardBackendUrl:
    Description: Dashboard API Gateway URL
    Value:
      Fn::Sub: "https://${DashboardBackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/"
