AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Drone surveillance system Cloud backend API and Lambda functions
Globals:
  Function:
    Timeout: 40
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Parameters:
  CloudBackendLambdaFunctionsRoleArn:
    Type: String
  DashboardBackendLambdaFunctionsRoleArn:
    Type: String
  SnsTopicArn:
    Type: String
  DBHost:
    Type: String
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: True
  UserPoolArn:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  LambdaSecurityGroupId:
    Type: String
Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: drone-shared-layer
      Description: Shared utilities for Drone Surveillance System
      ContentUri: shared/
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13
  GsBackendApi:
    Type: AWS::Serverless::Api
    Properties:
      Description: Drone surveillance system Cloud backend API
      StageName: prod
      Auth:
        DefaultAuthorizer: AWS_IAM
        InvokeRole: NONE
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          ResourcePath: "/*"
          HttpMethod: "*"
  gsBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          DB_HOST:
            Ref: DBHost
          DB_NAME: wf_detection
          DB_USER:
            Ref: DBUser
          DB_PASSWORD:
            Ref: DBPassword
          DB_PORT: "5432"
          SNS_TOPIC_ARN:
            Ref: SnsTopicArn
      CodeUri: src/
      Handler: app.handler
      Layers:
        - Ref: SharedLayer
      Role:
        Ref: CloudBackendLambdaFunctionsRoleArn
      Runtime: python3.13
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      LoggingConfig:
        LogFormat: JSON
        LogGroup: "/drone-surveillance-system/gs/logs"
      Events:
        SendAlertData:
          Type: Api
          Properties:
            RestApiId:
              Ref: GsBackendApi
            Path: /ground-station/alert
            Method: post
    Metadata:
      BuildMethod: python3.13
  # Temporary Solution Because We Are Using SNS
  preAuthHandlers:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Ref: SnsTopicArn
      CodeUri: pre_auth_handlers/
      Handler: app.handler
      Layers:
        - Ref: SharedLayer
      Role:
        Ref: DashboardBackendLambdaFunctionsRoleArn
      Runtime: python3.13
      Architectures:
        - x86_64
      LoggingConfig:
        LogFormat: JSON
        LogGroup: "/drone-surveillance-system/dashboard/logs"
    Metadata:
      BuildMethod: python3.13
  CognitoEmailSenderFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref preAuthHandlers
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Ref UserPoolArn
Outputs:
  CloudBackendUrl:
    Description: API Gateway URL
    Value:
      Fn::Sub: "https://${GsBackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/"
