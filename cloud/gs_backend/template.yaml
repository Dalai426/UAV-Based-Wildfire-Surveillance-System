AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Drone surveillance system Cloud backend API and Lambda functions
Globals:
  Function:
    Timeout: 40
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Parameters:
  CloudBackendLambdaFunctionsRoleArn:
    Type: String
  DBHost:
    Type: String
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: True
  LambdaLogGroupName:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  GsBackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: AWS_IAM
  gsBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          DB_HOST:
            Ref: DBHost
          DB_NAME: wf_detection
          DB_USER:
            Ref: DBUser
          DB_PASSWORD:
            Ref: DBPassword
          DB_PORT: "5432"
      CodeUri: src/
      Handler: app.handler
      Role:
        Ref: CloudBackendLambdaFunctionsRoleArn
      Runtime: python3.13
      Architectures:
        - x86_64
      VpcConfig:
        SecurityGroupIds:
          - Ref: LambdaSecurityGroupId
        SubnetIds:
          Ref: PrivateSubnetIds
      LoggingConfig:
        LogFormat: JSON
        LogGroup: /drone-surveillance-system/gs/logs
      Events:
        SendAlertData:
          Type: Api
          Properties:
            RestApiId:
              Ref: GsBackendApi
            Path: /ground-station/alert
            Method: post
            Auth:
              Authorizer: AWS_IAM
    Metadata:
      BuildMethod: python3.13
Outputs:
  CloudBackendUrl:
    Description: API Gateway URL
    Value:
      Fn::Sub: "https://${GsBackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/"
