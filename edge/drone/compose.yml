# The virtual drone: two containers that together behave like a real drone.
#
#   sitl    the simulated flight controller (ArduPilot SITL). Sends MAVLink telemetry.
#   camera  the simulated camera (stream_video.sh). Sends the live video.
#
# Both live in their own Docker network, "drone-net", separate from the ground station.
# They reach the ground station only through the ports it opens on the host
# (host.docker.internal), exactly like a separate device would.
#
# Settings come from .env (copy .env.example to .env first). See README.md.
#
# Start the ground station first (edge/ground-station), then:
#   docker compose up -d

name: wildfire-drone

services:

  # Simulated flight controller: ArduPilot SITL + MAVProxy.
  sitl:
    build:
      context: ./sitl
    image: wildfire-drone-sitl

    environment:
      # Where to send the telemetry (QGroundControl on 14550, the ground station core on 14551).
      GROUND_HOST: ${GROUND_HOST:-host.docker.internal}

      # Start position: latitude, longitude, altitude (m), heading (degrees).
      HOME_LOCATION: ${HOME_LOCATION:-55.7670,12.3830,40,0}

    # Keep a terminal open for MAVProxy's command prompt.
    # Open it with `docker compose attach sitl`, leave it with Ctrl+P then Ctrl+Q.
    # (Ctrl+C would stop the simulator.)
    tty: true
    stdin_open: true

    # Docker Desktop (macOS, Windows) knows host.docker.internal by itself.
    # On Linux (and later the Raspberry Pi) this line adds it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - drone-net

    # Restart the flight controller if it crashes, but not after `docker compose stop`.
    restart: unless-stopped

    # Note: no "ports:" section. The drone opens no ports of its own;
    # it only starts connections to the ground station.

  # Simulated camera: plays a recorded drone video as a live H.264 stream to MediaMTX.
  camera:
    build:
      # The build context is this folder, so the Dockerfile can copy stream_video.sh.
      context: .
      dockerfile: camera/Dockerfile
    image: wildfire-drone-camera

    # Arguments for stream_video.sh: [video_file] [bitrate]
    command: ["/videos/${VIDEO_FILE:-zenmuse.mp4}", "${BITRATE:-4M}"]

    environment:
      # Where MediaMTX is, and which stream path (one per drone) to publish to.
      GROUND: ${GROUND_HOST:-host.docker.internal}
      STREAM_KEY: ${STREAM_KEY:-d7f3a91c}

    volumes:
      # The folder with the video, read-only. Compose stops with this message if it is not set.
      - ${VIDEO_DIR:?Set VIDEO_DIR in .env to the folder that contains the video}:/videos:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - drone-net

    # Try again if streaming fails (e.g. the ground station isn't running yet).
    # When the video has played to the end, the script exits normally and the container stays stopped.
    restart: on-failure

networks:
  # The drone's own network. Only the drone's containers are in it.
  drone-net:
